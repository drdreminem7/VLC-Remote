name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --editable '.[dev]'

      - name: Install frontend dependencies
        run: npm ci

      - name: Backend formatting and lint
        run: |
          ruff format --check backend scripts
          ruff check backend scripts

      - name: Frontend lint
        run: npm run lint

      - name: Type checking
        run: |
          mypy backend scripts/check_vlc.py
          npm run typecheck

      - name: Backend tests
        run: pytest

      - name: Frontend tests
        run: npm run test

      - name: Frontend production build
        run: npm run build
