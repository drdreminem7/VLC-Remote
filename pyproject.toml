[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-vlc-remote"
version = "0.1.0"
description = "A secure, local, mobile-first web remote for VLC on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mac VLC Remote contributors" }]
dependencies = [
    "fastapi==0.140.13",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["backend/app/static"]
